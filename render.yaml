services:
  - type: web
    name: ecosynapse-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecosynapse-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://ecosynapse-web.onrender.com,http://localhost:5173
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: hashing
      - key: PORT
        value: 8000

  - type: web
    name: ecosynapse-web
    runtime: static
    region: singapore
    plan: free
    rootDir: apps/web
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ecosynapse-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
