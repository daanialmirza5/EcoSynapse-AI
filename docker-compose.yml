services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecosynapse
      POSTGRES_PASSWORD: ecosynapse
      POSTGRES_DB: ecosynapse
    volumes:
      - db_data:/var/lib/postgresql/data
    # Intentionally not published to the host: only the `api` service needs
    # to reach this over the internal Docker network (service name `db`).
    # This also avoids colliding with a Postgres instance already running on
    # the host's default port. Uncomment below for local DB debugging:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosynapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://ecosynapse:ecosynapse@db:5432/ecosynapse
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
